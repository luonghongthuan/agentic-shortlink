# One gateway for every agent and script: keys stay here, budgets and logs in one place.
# Run:  pip install 'litellm[proxy]' && litellm --config gateway/litellm.config.yaml --port 4000
# Model ids change often: check each provider's model page and update the right-hand side.

model_list:
  - model_name: claude-opus-5-5
    litellm_params:
      model: anthropic/claude-opus-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: claude-sonnet-5-5
    litellm_params:
      model: anthropic/claude-sonnet-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: claude-haiku-5-5
    litellm_params:
      model: anthropic/claude-haiku-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: gpt-6.1-sol
    litellm_params:
      model: openai/gpt-6.1-sol
      api_key: os.environ/OPENAI_API_KEY
  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-3.8-flash
      api_key: os.environ/GEMINI_API_KEY
  - model_name: local-coder
    litellm_params:
      model: ollama_chat/qwen3-coder
      api_base: http://localhost:11434

router_settings:
  fallbacks:
    - claude-sonnet-5-5: [gpt-6.1-sol]
    - gemini-flash: [claude-haiku-5-5]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
